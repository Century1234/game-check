<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Top Up - My Game Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070B28;
            --card-bg: linear-gradient(180deg, rgba(12, 22, 58, 0.96) 0%, rgba(5, 10, 32, 0.98) 100%);
            --text-color: #f8fbff;
            --border-color: rgba(75, 214, 255, 0.14);
            --accent-color: #47f28f;
            --active-bg: rgba(71, 242, 143, 0.15);
            --active-border: #47f28f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            padding-bottom: 100px;
        }

        .navbar {
            background-color: #010b3b;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            margin-right: 15px;
        }

        .step-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .step-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step-number {
            background-color: var(--accent-color);
            color: #000;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: white;
        }

        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-color);
            color: white;
            box-shadow: none;
        }

        .package-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        @media (min-width: 768px) {
            .package-grid { grid-template-columns: repeat(3, 1fr); gap: 15px; }
        }

        .package-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background-color: rgba(255,255,255,0.02);
        }

        .package-card.selected {
            background-color: var(--active-bg);
            border-color: var(--active-border);
        }

        .package-amount {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        .package-price {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-top: 5px;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #010b3b;
            border-top: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .total-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .btn-buy {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            padding: 10px 30px;
            border-radius: 25px;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Sticky Navigation -->
    <nav class="navbar sticky-top px-3 py-3">
        <div class="d-flex align-items-center">
            <a href="index.html" class="back-btn">←</a>
            <h5 class="mb-0 text-white" id="headerTitle">Loading...</h5>
        </div>
    </nav>

    <div class="container mt-4" style="max-width: 800px;">
        
        <!-- Step 1: User ID -->
        <div class="step-card">
            <div class="step-title">
                <span class="step-number">1</span>
                <span>Enter Player Info</span>
            </div>
            <div class="row g-2">
                <div class="col-7">
                    <input type="text" class="form-control" placeholder="Player ID" required>
                </div>
                <div class="col-5">
                    <input type="text" class="form-control" placeholder="Server ID" required>
                </div>
            </div>
        </div>

        <!-- Step 2: Select Recharge -->
        <div class="step-card">
            <div class="step-title">
                <span class="step-number">2</span>
                <span>Select Recharge Item</span>
            </div>
            <div class="package-grid">
                <div class="package-card" data-price="150">
                    <div class="package-amount" id="item1">💎 86 Diamonds</div>
                    <div class="package-price">¥ 150</div>
                </div>
                <div class="package-card" data-price="300">
                    <div class="package-amount" id="item2">💎 172 Diamonds</div>
                    <div class="package-price">¥ 300</div>
                </div>
                <div class="package-card" data-price="1500">
                    <div class="package-amount" id="item3">💎 875 Diamonds</div>
                    <div class="package-price">¥ 1,500</div>
                </div>
                <div class="package-card" data-price="3000">
                    <div class="package-amount" id="item4">💎 2010 Diamonds</div>
                    <div class="package-price">¥ 3,000</div>
                </div>
            </div>
        </div>

        <!-- Step 3: Payment Method -->
        <div class="step-card">
            <div class="step-title">
                <span class="step-number">3</span>
                <span>Select Payment</span>
            </div>
            <select class="form-select form-control">
                <option value="wallet">My Wallet (¥ 0)</option>
                <option value="paypay">PayPay</option>
                <option value="credit">Credit Card</option>
            </select>
        </div>

    </div>

    <!-- Fixed Bottom Bar -->
    <div class="bottom-bar">
        <div>
            <div style="font-size: 0.8rem; color: #ccc;">Total</div>
            <div class="total-price" id="displayTotal">¥ 0</div>
        </div>
        <button class="btn-buy" id="buyButton" disabled>Buy Now</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- 1. ゲームごとのデータ設定 ---
            const gameData = {
                'mlbb': { name: 'Mobile Legends', unit: '💎', currency: 'Diamonds' },
                'pubg': { name: 'PUBG Mobile', unit: '🅤', currency: 'UC' },
                'coc':  { name: 'Clash of Clans', unit: '🟩', currency: 'Gems' },
                'cr':   { name: 'Clash Royale', unit: '🟩', currency: 'Gems' },
                'bs':   { name: 'Brawl Stars', unit: '🟩', currency: 'Gems' }
            };

            // --- 2. URLからゲームIDを取得する ---
            const urlParams = new URLSearchParams(window.location.search);
            const gameId = urlParams.get('game'); // 例: 'mlbb' や 'pubg'

            // --- 3. 画面のタイトルと商品名を書き換える ---
            if (gameId && gameData[gameId]) {
                const game = gameData[gameId];
                
                // ヘッダーとブラウザタブのタイトルを変更
                document.getElementById('headerTitle').textContent = game.name + ' Top Up';
                document.getElementById('pageTitle').textContent = game.name + ' - My Game Shop';

                // パッケージの単位（ダイヤやUCなど）を変更
                document.getElementById('item1').textContent = `${game.unit} 86 ${game.currency}`;
                document.getElementById('item2').textContent = `${game.unit} 172 ${game.currency}`;
                document.getElementById('item3').textContent = `${game.unit} 875 ${game.currency}`;
                document.getElementById('item4').textContent = `${game.unit} 2010 ${game.currency}`;
            } else {
                // パラメータが無い（直接開いた）場合のデフォルト表示
                document.getElementById('headerTitle').textContent = 'Game Top Up';
            }

            // --- 4. パッケージ選択の動作 ---
            const packages = document.querySelectorAll('.package-card');
            const displayTotal = document.getElementById('displayTotal');
            const buyButton = document.getElementById('buyButton');

            packages.forEach(pkg => {
                pkg.addEventListener('click', function() {
                    packages.forEach(p => p.classList.remove('selected'));
                    this.classList.add('selected');
                    
                    const currentPrice = parseInt(this.getAttribute('data-price'));
                    displayTotal.textContent = '¥ ' + currentPrice.toLocaleString();
                    buyButton.disabled = false;
                });
            });
        });
    </script>
</body>
</html>
